<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>Simulatore MCPA · Model Context Protocol Associate</title>
<meta name="description" content="Simulatore d'esame e corso per la certificazione MCPA (Model Context Protocol Associate), allineato alla spec MCP 2026-07-28. 641 domande, italiano e inglese.">
<meta name="theme-color" content="#2f5bd3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bd3'/%3E%3Cpath d='M9 22V10l7 7 7-7v12' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try{var th=localStorage.getItem("mcpa-sim-theme");if(th==="light"||th==="dark")document.documentElement.dataset.theme=th;if(localStorage.getItem("mcpa-sim-side")==="mini")document.documentElement.classList.add("side-mini");}catch(e){}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#app" data-i18n="skip">Vai al contenuto</a>
<aside class="side" id="side" aria-label="Menu">
  <div class="side-head">
    <a class="brand" href="#home" aria-label="MCPA sim">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9 22V10l7 7 7-7v12" fill="none" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lbl"><span style="color:var(--ink)">MCPA</span> <span>sim</span></span>

    <button type="button" class="icon-btn side-toggle" id="sideMini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path class="chev" d="M15 10l-2 2 2 2"/></svg></button>

  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>

    <button type="button" class="icon-btn burger" id="burger" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>

  <main id="app" tabindex="-1"><p class="muted">Caricamento…</p></main>
  <footer class="foot"><span data-i18n="footer">Spec di riferimento 2026-07-28. Materiale di studio non ufficiale: in caso di dubbio vale la spec.</span></footer>
</div>
