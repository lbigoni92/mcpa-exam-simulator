# Render Blueprint, piano gratuito (vedi DEPLOY.md).
# Il disco del piano free si azzera a ogni deploy o riavvio: i progressi online si perdono.
# Per conservarli usa Impostazioni > Esporta i progressi / Importa da file.
# Variante a pagamento con disco persistente: plan: starter e il blocco "disk" in fondo (togli i #).
services:
  - type: web
    name: mcpa-sim
    runtime: docker
    rootDir: site
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: MCPA_PASSWORD
        sync: false            # la inserisci tu nella dashboard (almeno 12 caratteri)
      - key: PORT
        value: "8765"
      - key: MCPA_PORT
        value: "8765"
    # disk:
    #   name: mcpa-data
    #   mountPath: /data
    #   sizeGB: 1
